services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_VERSION: ${APP_VERSION:-}
    container_name: ${DOCKER_NAME:-iapp-skeleton}-dev
    ports:
      - "127.0.0.1:3020:3000"  # Frontend Vite dev server (this machine only)
      - "127.0.0.1:3021:3001"  # Backend API (this machine only)
    env_file: .env
    volumes:
      - ./src/backend:/app/backend
      - ./src/frontend:/app/frontend
      - ./VERSION:/app/VERSION:ro
      - ./.env:/app/.env
      - ./data/uploads:/app/uploads
      - /app/backend/node_modules
      - /app/frontend/node_modules
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3001}
      - FRONTEND_URL=http://localhost:3020
      # Vite proxies /api to the backend inside the same container.
      - VITE_API_URL=http://localhost:3001
      - ENV_FILE_PATH=/app/.env
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/app/uploads
      - TZ=${TZ:-UTC}
      - APP_VERSION=${APP_VERSION:-}
      - VITE_APP_VERSION=${APP_VERSION:-}
    restart: unless-stopped
    command: ./start-dev.sh

networks:
  default:
    external: true
    name: "docker-lan"
