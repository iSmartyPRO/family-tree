<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A6E" />
    <title>Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #e2e8f0; }
        p { color: #94a3b8 !important; }
      }
      img { width: 76px; height: 76px; border-radius: 20px; box-shadow: 0 14px 30px -14px rgba(15, 23, 42, 0.5); }
      h1 { margin: 22px 0 8px; font-size: 22px; }
      p { margin: 0 0 22px; color: #64748b; line-height: 1.5; max-width: 340px; }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
        background: #1e3a6e;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <h1 data-ru="Портал временно недоступен" data-en="The portal is temporarily unavailable">Портал временно недоступен</h1>
      <p data-ru="Идут технические работы или пропала связь с интернетом. Страница откроется сама, как только портал снова будет доступен." data-en="Technical works are in progress or the connection is lost. The page opens by itself as soon as the portal is back.">
        Идут технические работы или пропала связь с интернетом. Страница откроется сама, как только портал снова будет доступен.
      </p>
      <button type="button" id="retry" data-ru="Повторить" data-en="Try again">Повторить</button>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
