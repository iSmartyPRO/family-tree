# Logs go to the container output (docker logs, rotated by the compose logging
# options) instead of growing files inside the container. /proc/1/fd/* is the
# output of start.sh (PID 1): nginx runs as a daemon, and /dev/stdout of a
# daemon would point at /dev/null after a reload.
error_log /proc/1/fd/2 warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    # Alpine's mime.types has no .mjs: pdf.js loads its worker as an ES module,
    # and with nosniff an octet-stream response is refused by the browser.
    types {
        text/javascript mjs;
        font/ttf ttf;
    }
    default_type  application/octet-stream;

    # The access log masks tokens in addresses (?t=…, read-only file tokens
    # of public links; ?access_token=…, online editor calls from Collabora)
    # so logs hold no usable credentials.
    map $request $loggable_request {
        "~^(?<lr_head>.*[?&](?:t|access_token)=)[^&\s]*(?<lr_tail>.*)$" "${lr_head}***${lr_tail}";
        default $request;
    }

    # The online editor (Collabora) origin, when the app enables it: the app
    # sends it with every page (X-Portal-Frame-Src) and it is added to the
    # page's CSP frame-src and form-action (the editor frame is loaded by a
    # form post). Only a bare http(s) origin is accepted.
    map $upstream_http_x_portal_frame_src $editor_csp_origin {
        "~^(?<eo>https?://[A-Za-z0-9.-]+(?::[0-9]{1,5})?)$" " $eo";
        default "";
    }
    log_format masked '$remote_addr - $remote_user [$time_local] "$loggable_request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /proc/1/fd/1 masked;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm;

    # Scheme the visitor used. Behind another TLS-terminating proxy this nginx
    # only sees plain http, so that proxy's X-Forwarded-Proto is passed on
    # (http/https only); without one, the scheme of this connection. The app
    # trusts the header from loopback (this nginx) only.
    map $http_x_forwarded_proto $forwarded_proto {
        default        $scheme;
        "~*^\s*https\b" https;
        "~*^\s*http\b"  http;
    }

    # 127.0.0.1, not localhost: the app listens on IPv4 only, and "localhost"
    # also resolves to [::1] — every request then first tried [::1], got
    # "connection refused" (≈1100 log errors a day) and marked it down.
    upstream backend {
        server 127.0.0.1:3001;
    }

    server {
        listen 80;
        server_name localhost;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://telegram.org; worker-src 'self' blob:; frame-src https://oauth.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # While the app server restarts (deploys) or is down, API calls get a
        # JSON answer the frontend turns into the "technical works" screen.
        error_page 502 504 = @unavailable;
        location @unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 503 '{"success":false,"code":"MAINTENANCE","error":"The portal is restarting or temporarily unavailable"}';
        }

        location ~ /\. {
            deny all;
            return 404;
        }

        # Vite emits content-hashed bundles: cache them forever.
        location /assets/ {
            root /app/frontend/dist;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Service worker of the installed app (PWA): never cached, so updates reach phones at once.
        location = /sw.js {
            root /app/frontend/dist;
            add_header Cache-Control "no-cache" always;
            add_header Service-Worker-Allowed "/" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # There is no favicon.ico file: without this the SPA fallback answered
        # it with index.html. The API redirects to the configured app icon
        # (or the bundled /favicon.svg) with no-cache, so a new icon shows up
        # for clients that ask for /favicon.ico directly.
        location = /favicon.ico {
            proxy_pass http://backend/api/pwa/icon;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Built files (version.json, sw.js, icons, pdf.js…) are served as they
        # are and always revalidated. Page addresses (/, /login, /l/<token>,
        # /s/<slug>…) go to @shell.
        location / {
            root /app/frontend/dist;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://telegram.org; worker-src 'self' blob:; frame-src https://oauth.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            try_files $uri @shell;
        }

        # index.html must always be revalidated so new deploys are picked up.
        location = /index.html {
            root /app/frontend/dist;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://telegram.org; worker-src 'self' blob:; frame-src https://oauth.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            try_files /index.html =404;
        }

        # Pages: the app server answers with index.html carrying the portal's
        # name, icon and, for public links, the resource's own preview tags
        # (Open Graph for WhatsApp, Telegram, Slack… — services/linkPreview).
        # While it is down or slow, the static index.html (neutral defaults)
        # keeps the app and its "technical works" screen working.
        location @shell {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            # Host with its port: og:url and og:image must be absolute addresses
            # (PUBLIC_URL, when set, wins).
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Portal-Shell 1;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_intercept_errors on;
            error_page 404 405 500 502 503 504 = @static_shell;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Portal-Frame-Src;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://telegram.org; worker-src 'self' blob:; frame-src https://oauth.telegram.org$editor_csp_origin; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'$editor_csp_origin" always;
        }

        location @static_shell {
            root /app/frontend/dist;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://telegram.org; worker-src 'self' blob:; frame-src https://oauth.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            try_files /index.html =404;
        }

        # Logo (2 MB) and avatar (1 MB) uploads: the body is multipart, so the
        # nginx limit sits a little above the app's own limit, which answers
        # with a clear message instead of nginx's bare 413 page.
        location ~ ^/api(/v1)?/(admin/settings/logo|admin/users/[0-9]+/avatar|account/avatar)$ {
            client_max_body_size 3m;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Custom theme backgrounds (8 MB in the app, which answers with a clear message).
        location ~ ^/api/account/background$ {
            client_max_body_size 9m;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Files public links that accept uploads (/l/<token>: upload, replace):
        # the same cap as signed-in Files uploads; the app applies the module
        # limit and the link's own size and quota limits with clear messages.
        location ~ ^/api(/v1)?/l/[A-Za-z0-9_-]+/(upload|nodes/[0-9]+/replace)$ {
            client_max_body_size 1024m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Online editor callbacks (WOPI, from the Collabora server): document
        # downloads and saves, streamed both ways. The app applies the module
        # size limits; ?access_token= is masked in the access log (above).
        location ~ ^/api(/v1)?/wopi/ {
            client_max_body_size 1024m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Module APIs (also under /api/v1 for integrations) accept large uploads (the per-module limit lives in its settings)
        # and may wait on document conversion, so they stream and time out later.
        location /api/app/ {
            client_max_body_size 1024m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api/v1/app/ {
            client_max_body_size 1024m;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        location /uploads/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'none'; script-src 'none'" always;
        }

        # Docker's health check hits this every 30 s: not worth a log line.
        location /health {
            access_log off;
            proxy_pass http://backend/health;
        }

        location /ready {
            access_log off;
            proxy_pass http://backend/ready;
        }
    }
}
